<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chess Board</title>
<style>
  body {
    display: flex;
    justify-content: center;
    margin-top: 30px;
    font-family: sans-serif;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 60px);
    grid-template-rows: repeat(8, 60px);
    border: 3px solid #333;
  }

  .square {
    width: 60px;
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
    cursor: pointer;
    user-select: none;
  }

  .light { background: #f0d9b5; }
  .dark  { background: #b58863; }

  .selected {
    outline: 3px solid red;
  }

  .move {
    background: radial-gradient(circle, rgba(0,0,0,0.3) 25%, transparent 26%);
  }
</style>
</head>
<body>

<div class="board" id="board"></div>

<script>
const boardEl = document.getElementById("board");

const pieces = {
  r:"♜", n:"♞", b:"♝", q:"♛", k:"♚", p:"♟",
  R:"♖", N:"♘", B:"♗", Q:"♕", K:"♔", P:"♙"
};

let board = [
  ["r","n","b","q","k","b","n","r"],
  ["p","p","p","p","p","p","p","p"],
  ["","","","","","","",""],
  ["","","","","","","",""],
  ["","","","","","","",""],
  ["","","","","","","",""],
  ["P","P","P","P","P","P","P","P"],
  ["R","N","B","Q","K","B","N","R"]
];

let selected = null;

function drawBoard() {
  boardEl.innerHTML = "";
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sq = document.createElement("div");
      sq.className = "square " + ((r + c) % 2 ? "dark" : "light");
      sq.dataset.r = r;
      sq.dataset.c = c;
      if (board[r][c]) sq.textContent = pieces[board[r][c]];
      sq.onclick = () => clickSquare(r, c);
      boardEl.appendChild(sq);
    }
  }
}

function clickSquare(r, c) {
  clearHighlights();
  const piece = board[r][c];

  if (piece) {
    selected = { r, c, piece };
    highlight(r, c, "selected");
    getMoves(r, c, piece).forEach(m =>
      highlight(m.r, m.c, "move")
    );
  }
}

function highlight(r, c, cls) {
  document.querySelector(
    `.square[data-r="${r}"][data-c="${c}"]`
  ).classList.add(cls);
}

function clearHighlights() {
  document.querySelectorAll(".square").forEach(sq =>
    sq.classList.remove("selected", "move")
  );
}

function isWhite(p) { return p === p.toUpperCase(); }
function inBoard(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }

function getMoves(r, c, p) {
  const moves = [];
  const dir = isWhite(p) ? -1 : 1;

  if (p.toLowerCase() === "p") {
    if (inBoard(r + dir, c) && !board[r + dir][c])
      moves.push({ r: r + dir, c });

    const startRow = isWhite(p) ? 6 : 1;
    if (r === startRow && !board[r + dir][c] && !board[r + 2 * dir][c])
      moves.push({ r: r + 2 * dir, c });
  }

  if (p.toLowerCase() === "n") {
    [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]
      .forEach(([dr,dc])=>{
        const nr=r+dr,nc=c+dc;
        if(inBoard(nr,nc)) moves.push({r:nr,c:nc});
      });
  }

  if ("rbq".includes(p.toLowerCase())) {
    const dirs = [];
    if ("rq".includes(p.toLowerCase()))
      dirs.push([1,0],[-1,0],[0,1],[0,-1]);
    if ("bq".includes(p.toLowerCase()))
      dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);

    dirs.forEach(([dr,dc])=>{
      let nr=r+dr,nc=c+dc;
      while(inBoard(nr,nc)){
        moves.push({r:nr,c:nc});
        if(board[nr][nc]) break;
        nr+=dr; nc+=dc;
      }
    });
  }

  if (p.toLowerCase() === "k") {
    for (let dr=-1;dr<=1;dr++)
      for (let dc=-1;dc<=1;dc++)
        if(dr||dc){
          const nr=r+dr,nc=c+dc;
          if(inBoard(nr,nc)) moves.push({r:nr,c:nc});
        }
  }

  return moves;
}

drawBoard();
</script>

</body>
</html>
